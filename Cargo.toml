[package]
name = "feishu-bot"
version = "0.1.0"
edition = "2021"
description = "AI-ready Feishu Bot command-line automation for messages, docs, Wiki, Base, tasks, Drive, search, and OpenAPI workflows"
license = "MIT"
repository = "https://github.com/ChaosRealmsAI/feishu-bot"
homepage = "https://github.com/ChaosRealmsAI/feishu-bot"
documentation = "https://docs.rs/feishu-bot"
readme = "README.md"
keywords = ["feishu", "lark", "cli", "automation", "ai"]
categories = ["command-line-utilities", "api-bindings"]
include = [
  "Cargo.toml",
  "Cargo.lock",
  "LICENSE",
  "README.md",
  ".env.example",
  "docs/**",
  "private/.env.example",
  "private/.gitignore",
  "scripts/**",
  "skills/feishu-bot-office/**",
  "src/**",
]

[workspace]

[dependencies]
anyhow = "1"
base64 = "0.22"
chrono = "0.4"
clap = { version = "4", features = ["derive"] }
dirs = "6"
dotenvy = "0.15"
reqwest = { version = "0.12", features = ["json", "multipart", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
uuid = { version = "1", features = ["v4"] }

[[bin]]
name = "feishu-bot"
path = "src/bin/feishu-bot.rs"

[[bin]]
name = "feishuBot"
path = "src/bin/feishuBot.rs"

[[bin]]
name = "feishu"
path = "src/bin/feishu.rs"
